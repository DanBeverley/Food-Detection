data:
  image_size: [256, 256]  
  batch_size: 32
  split_ratios:
    train: 0.7
    val: 0.15
    test: 0.15
  num_classes: 1 # Number of segmentation classes (e.g., 1 for foreground + 1 for background, or N food classes + background)
  random_seed: 42 
  debug_max_samples: null
  num_train_samples: 71160
  num_val_samples: 15249
  num_test_samples: 15249  

  use_depth_map: true
  depth_map_dir_name: "depth"

  use_point_cloud: true
  point_cloud_root_dir: "/kaggle/input/metafood3d-pointcloud/_MetaFood3D_new_Point_cloud/Point_cloud"
  point_cloud_sampling_rate_dir: "4096" 
  point_cloud_suffix: "_sampled_1.ply" 

  modalities_preprocessing:
    depth_map:
      normalization: "min_max_local" 
    point_cloud:
      num_points: 4096 
      normalization: "unit_sphere"

  augmentation:
    enabled: true
    horizontal_flip: true
    rotation_range: 20
    zoom_range: 0.2
    brightness_range: [0.7, 1.3]
    contrast_factor: 0.2
    apply_geometric_to_depth: true

# Model Configuration
model:
  name: 'fused_encoder_decoder' 
  backbone: 'EfficientNetB0' 
  depth_backbone: 'MobileNetV3Small'
  backbone_trainable: true
  
  decoder_dropout: 0.3
  decoder_batch_norm: true
  
  load_weights: false
  weights_path: 'path/to/your/weights.h5'
  
  activation: 'sigmoid'
  num_classes: 1  

optimizer:
  name: "AdamW"  
  
  stage1_learning_rate: 0.0001   
  stage2_learning_rate: 0.00001
  weight_decay: 0.01 
  clipnorm: 1.0  
  

loss:
  name: "combined_loss"  
  
  binary_crossentropy:
    weight: 0.5
    label_smoothing: 0.1 
    from_logits: false
  dice_loss:
    weight: 0.3
    smooth: 1.0
  focal_loss:
    weight: 0.2
    alpha: 0.25
    gamma: 2.0

training:
  epochs: 30
  stage1_epochs: 5
  debug_mode: false
  use_mixed_precision: true
  
  metrics: ["binary_accuracy", "binary_iou", "dice_coefficient", "precision", "recall"] 
  
  

  callbacks:
    model_checkpoint:
      enabled: true 
      monitor: "val_binary_iou"
      mode: "max" 
      save_best_only: true
      save_weights_only: false
      filename_template: "unet_epoch-{epoch:02d}_val_iou-{val_binary_iou:.4f}.h5"

    early_stopping:
      enabled: true
      monitor: "val_binary_iou"
      mode: "max"
      patience: 10  
      restore_best_weights: true
      min_delta: 0.001

    reduce_lr_on_plateau:
      enabled: true  
      monitor: "val_binary_iou"
      mode: "max"
      factor: 0.5
      patience: 6  
      min_lr: 0.00001
      cooldown: 3

    tensorboard:
      enabled: true
      log_dir: "logs/segmentation/"
      histogram_freq: 1  
      write_graph: true  
      update_freq: "epoch"
      write_images: true 

  


# Paths Configuration 
paths:
  model_save_dir: "trained_models/segmentation/"
  log_dir: "logs/segmentation/"
  metadata_dir: "data/segmentation"
  metadata_filename: "metadata.json"
  tfrecord_dir: "data/segmentation/tfrecords"

# Export Configuration
export:
  tflite_filename: "segmentation_model_final.tflite"

  quantization:
    type: "int8" # 'none', 'default', 'float16', 'int8'. Review for segmentation; int8 might need representative_dataset enabled.
    representative_dataset:
      enabled: true
      num_samples: 50

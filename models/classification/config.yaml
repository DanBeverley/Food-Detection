data:
  paths:
    metadata_file: "data/classification/metadata.json"
    label_map_file: "data/classification/label_map.json"
  
  base_data_dir: "path/to/local/RGBD_videos"

  image_size: [224, 224]
  batch_size: 64
  validation_split: 0.2
  random_seed: 42
  
  augmentation:
    enabled: true
    rotation_range: 20
    zoom_range: 0.15

model:
  architecture: "MobileNetV2"
  use_pretrained_weights: true
  fine_tune: true
  fine_tune_layers: 20

  classification_head:
    dense_layers:
      - units: 512
        batch_norm: true
        dropout: 0.5
    
optimizer:
  learning_rate: 0.001
  weight_decay: 0.0001

loss:
  params:
    label_smoothing: 0.1

training:
  epochs: 50
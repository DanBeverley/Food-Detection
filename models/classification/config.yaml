data:
  paths:
    train_metadata_file: "data/classification/train_metadata.json"
    val_metadata_file: "data/classification/val_metadata.json"
    label_map_file: "data/classification/label_map.json"
  base_data_dir: "path/to/local/RGBD_videos"
  image_size: [224, 224]
  batch_size: 32
  random_seed: 42
  augmentation:
    enabled: true
    horizontal_flip: true
    rotation_range: 15
    shift_scale_rotate: true
    coarse_dropout: true
    color_jitter: true
    mixup_alpha: 0.2
    cutmix_alpha: 1.0

model:
  architecture: "EfficientNetV2B0"
  use_pretrained_weights: true
  stage1_trainable_layers: 0
  stage2_trainable_layers: 30
  classification_head:
    l2_regularization: 0.0001
    dropout: 0.2
    dense_layers:
      - units: 512
        activation: 'relu'
        batch_norm: true
    
optimizer:
  stage1_weight_decay: 0.001
  stage1_learning_rate: 0.0002
  stage2_weight_decay: 1e-5
  stage2_learning_rate: 5e-05
  clipnorm: 1.0

loss:
  params:
    label_smoothing: 0.1

training:
  stage1_epochs: 5
  stage2_epochs: 100

export:
  tflite_filename: "classification_model_final.tflite"
  quantization:
    type: "none"
    representative_dataset:
      enabled: true
      num_samples: 500

paths:
  model_save_dir: "trained_models/classification/"
  tflite_export_dir: "trained_models/classification/exported/"
  label_map_dir: "data/classification"
  label_map_filename: "label_map.json"
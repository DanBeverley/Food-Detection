data:
  paths:
    train_metadata_file: "data/classification/train_metadata.json"
    val_metadata_file: "data/classification/val_metadata.json"
    label_map_file: "data/classification/label_map.json"
  
  base_data_dir: "path/to/local/RGBD_videos"

  image_size: [224, 224]
  batch_size: 32
  random_seed: 42
  
  augmentation:
    enabled: true
    mixup_alpha: 0.4
    cutmix_alpha: 1.0
    horizontal_flip: true
    rotation_range: 45
    width_shift_range: 0.3
    height_shift_range: 0.3
    zoom_range: 0.3
    brightness_range: [0.7, 1.3]
    shear_range: 0.2
    channel_shift_range: 20

model:
  architecture: "EfficientNetV2B0"
  use_pretrained_weights: true
  fine_tune: true
  fine_tune_layers: 20

  classification_head:
    dense_layers:
      - units: 256
        activation: 'relu'
        batch_norm: true
        dropout: 0.5
      - units: 128
        activation: 'relu'
        batch_norm: true
        dropout: 0.6
    
optimizer:
  stage1_learning_rate: 0.001
  stage2_learning_rate: 0.00005
  clipnorm: 1.0

loss:
  params:
    label_smoothing: 0.2

training:
  epochs: 50
  stage1_epochs: 5
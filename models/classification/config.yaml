data:
  paths:
    train_metadata_file: "data/classification/train_metadata.json"
    val_metadata_file: "data/classification/val_metadata.json"
    label_map_file: "data/classification/label_map.json"
  base_data_dir: "path/to/local/RGBD_videos"
  image_size: [224, 224]
  batch_size: 32
  random_seed: 42
  augmentation:
    enabled: true
    mixup_alpha: 0.2
    cutmix_alpha: 1.0
    horizontal_flip: true
    rotation_range: 20
    width_shift_range: 0.15
    height_shift_range: 0.15
    zoom_range: 0.2
    brightness_range: [0.8, 1.2]
    rand_augment: true
    rand_augment_layers: 2
    rand_augment_magnitude: 0.3

model:
  architecture: "EfficientNetV2B0"
  use_pretrained_weights: true
  stage1_trainable_layers: 0
  stage2_trainable_layers: 15
  classification_head:
    l2_regularization: 1e-4
    dense_layers:
      - units: 512
        activation: 'relu'
        batch_norm: true
        dropout: 0.4
    
optimizer:
  stage1_weight_decay: 1e-4
  stage1_learning_rate: 0.0002
  stage2_weight_decay: 1e-5
  stage2_learning_rate: 0.0001
  clipnorm: 1.0

loss:
  params:
    label_smoothing: 0.1

training:
  stage1_epochs: 5
  stage2_epochs: 50

export:
  tflite_filename: "classification_model_final.tflite"
  quantization:
    type: "none"
    representative_dataset:
      enabled: true
      num_samples: 500

paths:
  model_save_dir: "trained_models/classification/"
  tflite_export_dir: "trained_models/classification/exported/"
  label_map_dir: "data/classification"
  label_map_filename: "label_map.json"
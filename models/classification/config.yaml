data:
  paths:
    train_metadata_file: "data/classification/train_metadata.json"
    val_metadata_file: "data/classification/val_metadata.json"
    label_map_file: "data/classification/label_map.json"
  base_data_dir: "path/to/local/RGBD_videos"
  image_size: [224, 224]
  batch_size: 32
  random_seed: 42
  augmentation:
    enabled: true
    mixup_alpha: 0.2
    horizontal_flip: true
    rotation_range: 20
    width_shift_range: 0.1
    height_shift_range: 0.1
    zoom_range: 0.1
    brightness_range: [0.8, 1.2]

model:
  architecture: "EfficientNetV2B0"
  use_pretrained_weights: true
  stage1_trainable_layers: 0
  stage2_trainable_layers: 80
  classification_head:
    dense_layers:
      - units: 512
        activation: 'relu'
        batch_norm: true
        dropout: 0.4
    
optimizer:
  stage1_learning_rate: 0.001
  stage2_learning_rate: 0.0001
  clipnorm: 1.0

loss:
  params:
    label_smoothing: 0.1

training:
  stage1_epochs: 5
  stage2_epochs: 50